[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
test = 'test'
script = 'script'
cache_path = 'cache_forge'
auto_detect_solc = true
evm_version = 'cancun'
optimizer = true
optimizer_runs = 200
gas_reports = ['*']
# Suppress compiler warnings coming from vendored library code (Uniswap v4,
# OpenZeppelin, Sablier, prb-math, etc.). We cannot fix upstream, so silencing
# keeps our build output focused on warnings in our own code.
ignored_warnings_from = ['lib']
# Read-only. The pool scripts take their per-pool parameters from a checked-in JSON file, and the
# verify script reads the recorded deployment addresses. Neither needs to write, and no profile
# other than `deploy` may.
fs_permissions = [
    { access = "read", path = "./script/telx/pools.json" },
    { access = "read", path = "./deployments/" },
]

[rpc_endpoints]
ethereum = "${ETHEREUM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
base = "${BASE_RPC_URL}"

# Etherscan V2 serves every chain from one key, so the same secret is reused with an explicit
# chain id rather than a per-explorer key.
[etherscan]
ethereum = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
polygon = { key = "${ETHERSCAN_API_KEY}", chain = 137 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }

[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 256
depth = 15

# Fast iteration: skips fuzz/invariant cost but still runs each property once.
# Usage: FOUNDRY_PROFILE=fast forge test
# For full fuzz coverage, drop the env var (uses [profile.default]).
[profile.fast]
fuzz = { runs = 1 }
invariant = { runs = 1, depth = 1 }

# CI: moderate fuzz coverage without the full 256-run cost.
[profile.ci]
fuzz = { runs = 64 }
invariant = { runs = 64, depth = 10 }

# Deploy: the only profile that enables FFI and filesystem writes.
#
# safe-utils shells out (Safe Transaction Service API, hardware-wallet signing) and the deploy
# scripts persist addresses to `deployments/*.json`, so both permissions are genuinely required -
# but only while deploying. They stay off in `default` and `ci` so that `forge test`, which CI runs
# on every PR across eight vendored submodules, cannot execute host commands or write to the repo.
# Usage: FOUNDRY_PROFILE=deploy forge script ... --ffi
[profile.deploy]
ffi = true
fs_permissions = [
    { access = "read", path = "./script/telx/pools.json" },
    { access = "read-write", path = "./deployments/" },
]

[fmt]
line_length = 120
tab_width = 4

[lint]
# Lint is opt-in via `forge lint`; not run on every build. This matches `main`.
# Run it explicitly when auditing code quality: `forge lint`.
lint_on_build = false

